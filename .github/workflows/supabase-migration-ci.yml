name: Supabase Migration CI

on:
  push:
    branches:
      - supabase-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install pinned dependency graph
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Upload generated npm lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
