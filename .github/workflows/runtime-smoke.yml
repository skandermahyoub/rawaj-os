name: Runtime Smoke Test

on:
  push:
    branches:
      - main
      - admin-hardening
      - final-delivery-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://jidrhknvrctqzquyurxl.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LaoMEVpm3JWm3qf2VKZuMQ_Bahe1udI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production app
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser runtime smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/rawaj-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            const badResponses = [];
            page.on('pageerror', e => errors.push('PAGEERROR: ' + e.message));
            page.on('console', m => {
              if (m.type() === 'error') errors.push('CONSOLE: ' + m.text());
            });
            page.on('response', r => {
              if (r.status() >= 400) badResponses.push(r.status() + ' ' + r.url());
            });
            page.on('requestfailed', r => {
              badResponses.push('FAILED ' + r.url() + ' :: ' + (r.failure()?.errorText || 'unknown'));
            });
            const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 45000 });
            // Exercise every lazy-loaded storefront section rather than only the first viewport.
            const pageHeight = await page.evaluate(() => document.body.scrollHeight);
            for (let y = 0; y < pageHeight; y += 700) {
              await page.evaluate((nextY) => window.scrollTo(0, nextY), y);
              await page.waitForTimeout(120);
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(600);

            // Exercise every primary storefront route through the same UI navigation
            // a real visitor uses. This catches route-only rendering errors and broken assets.
            await page.setViewportSize({ width: 1440, height: 1000 });
            const routeLabels = [
              'الخدمات المتخصصة',
              'الأقسام والمصانع',
              'باقات المشاريع',
              'معرض الأعمال',
              'دليل المعايير والطباعة',
              'عن رواج والاتصال',
            ];
            for (const label of routeLabels) {
              await page.getByRole('button', { name: 'فتح القائمة الرئيسية' }).click();
              await page.getByRole('button', { name: label, exact: true }).last().click();
              await page.waitForTimeout(350);
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
              await page.waitForTimeout(250);
              const routeText = (await page.locator('#root').innerText()).trim();
              if (routeText.length < 20) errors.push('EMPTY_ROUTE: ' + label);
              await page.evaluate(() => window.scrollTo(0, 0));
            }

            const rootText = (await page.locator('#root').innerText()).trim();
            const bodyText = (await page.locator('body').innerText()).trim();
            console.log('HTTP_STATUS=' + (response ? response.status() : 'NO_RESPONSE'));
            console.log('ROOT_TEXT_LENGTH=' + rootText.length);
            console.log('BODY_TEXT_SAMPLE=' + bodyText.slice(0, 300).replace(/\n/g, ' | '));
            console.log('RUNTIME_ERRORS=' + JSON.stringify(errors));
            console.log('BAD_RESPONSES=' + JSON.stringify(badResponses));
            await page.screenshot({ path: '/tmp/rawaj-runtime.png', fullPage: true });
            await browser.close();
            if (!response || response.status() >= 400 || rootText.length < 20 || errors.length || badResponses.length) {
              process.exit(1);
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
