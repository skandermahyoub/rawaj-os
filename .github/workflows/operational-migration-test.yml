name: Operational Migration Database Test

on:
  push:
    branches:
      - audit/admin-operations
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install and start disposable PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb rawaj_test
      - name: Bootstrap minimal Supabase-compatible schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d rawaj_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
          end $$;
          create schema auth;
          create schema private;
          create table auth.users (id uuid primary key);
          create or replace function auth.uid() returns uuid language sql stable
          as $function$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $function$;
          create or replace function auth.jwt() returns jsonb language sql stable
          as $function$ select coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb $function$;
          create table public.profiles (id uuid primary key);
          create table public.quotes (
            id text primary key, reference_number text not null, customer jsonb not null default '{}',
            items jsonb not null default '[]', deadline_date date, general_notes text,
            status text not null default 'new', assigned_to uuid, internal_notes text, supplier_notes text,
            timeline jsonb not null default '[]', created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          create table public.design_tasks (
            id text primary key, title_ar text, client_name text, client_phone text, status text not null default 'new',
            deadline date, proof_versions jsonb not null default '[]', comments jsonb not null default '[]',
            created_at timestamptz not null default now(), updated_at timestamptz not null default now()
          );
          create or replace function private.has_any_role(roles text[]) returns boolean
          language sql stable as $$ select true $$;
          SQL
      - name: Apply operational migration against disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d rawaj_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261009180000_add_rawaj_operational_systems.sql
      - name: Verify project costs, inventory, invoice payments, and audit triggers
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d rawaj_test -v ON_ERROR_STOP=1 -f scripts/verify-rawaj-operational-migration.sql
